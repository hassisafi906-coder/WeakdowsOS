# =====================================================================
#  Weakdows OS - ISOLinux Bootloader Configuration
# =====================================================================

UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT weak10

MENU TITLE Weakdows OS - Universal Lightweight Bootloader

LABEL weak10
    MENU LABEL Start Weakdows 10 Lite (Bypassed)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img edition=weak10 bypass=tpm,secureboot

LABEL weak11
    MENU LABEL Start Weakdows 11 Lite (Ultra Fast)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img edition=weak11 bypass=all

LABEL weak7
    MENU LABEL Start Weak7 Classic Aero
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img edition=weak7

LABEL weakxp
    MENU LABEL Start WeakXP Stone-Age Edition
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img edition=weakxp
