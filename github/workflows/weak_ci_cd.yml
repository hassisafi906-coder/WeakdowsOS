# =====================================================================
#  Weakdows OS - GitHub Actions CI/CD Automated Build & Release Pipeline
# =====================================================================

name: Weakdows OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Rust & C++ Toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Run Localization Compiler Check
      run: |
        echo "[*] Compiling global language keys (RTL/LTR engine)..."
        if [ -f "localization/compiler.py" ]; then
          python localization/compiler.py
        else
          echo "[!] Localization compiler not found, skipping."
        fi

    - name: Verify Identity and Clean Bloatware
      run: |
        echo "[*] Checking project identity and running system debloater..."
        if [ -f "apps/tools/rename_identity.py" ]; then
          python apps/tools/rename_identity.py
        else
          echo "[!] Identity tool not found, skipping."
        fi

    - name: Build Weakdows ISO Image Generator
      run: |
        echo "[*] Testing ISO Image Build script..."
        if [ -f "build_iso.py" ]; then
          python build_iso.py
        else
          echo "[!] build_iso.py not found, skipping."
        fi

    - name: Success Notification
      run: |
        echo "[SUCCESS] Weakdows CI/CD pipeline completed successfully without bloat!"
